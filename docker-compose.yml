services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKERHUB_USERNAME:-local}/travel-booking-backend:${IMAGE_TAG:-latest}
    container_name: travel-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 7070
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "7070:7070"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - travel-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${DOCKERHUB_USERNAME:-local}/travel-booking-frontend:${IMAGE_TAG:-latest}
    container_name: travel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  mysql-data:
